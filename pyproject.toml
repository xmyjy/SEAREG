[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seareg"
version = "1.0.0"
description = "Multi-relational graph representation learning for spatial epigenomics"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
keywords = ["spatial-epigenomics", "chromatin-accessibility", "histone-modifications", "transcription-factor-motifs", "graph-representation-learning"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.13",
  "pandas>=2.2",
  "torch>=2.2",
  "anndata>=0.10",
  "scikit-learn>=1.7",
  "h5py>=3.11",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
cuda = ["triton>=2.2"]
analysis = [
  "scanpy>=1.11,<1.12",
  "umap-learn>=0.5",
  "igraph>=0.11,<0.12",
  "louvain>=0.8,<0.9",
  "matplotlib>=3.9",
]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "ipywidgets>=8,<9"]

[project.urls]
Homepage = "https://github.com/xmyjy/SEAREG"
Documentation = "https://seareg.readthedocs.io/en/latest/"
Source = "https://github.com/xmyjy/SEAREG"
Issues = "https://github.com/xmyjy/SEAREG/issues"

[project.scripts]
seareg = "seareg.cli:main"
seareg-annotate = "seareg._annotation_cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["seareg", "seareg.*"]

[tool.setuptools.package-data]
seareg = [
  "scanners/*.R",
  "scanners/*.json",
  "THIRD_PARTY_NOTICES.md",
  "_compiler/cuda11/ptxas",
  "_compiler/cuda11/LICENSE",
  "_compiler/cuda11/provenance.json",
]

