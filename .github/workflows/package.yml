name: Build and check package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-and-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      NUMBA_CACHE_DIR: /tmp/seareg-numba
      MPLCONFIGDIR: /tmp/seareg-matplotlib
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10.22'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install build environment
        run: |
          python -m pip install 'numpy>=1.26,<2'
          python -m pip install 'torch==2.2.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt build
          python -m pip install --no-deps .
          python -m pip check
      - name: Check CPU scientific contracts and release consistency
        run: python -m unittest discover -s tests -v
      - name: Check unique multislice publication
        run: python tools/check_multislice_release.py
      - name: Build distribution
        run: python -m build
      - name: Save wheel and source distribution
        uses: actions/upload-artifact@v7
        with:
          name: SEAREG-package
          path: dist/
          if-no-files-found: error
          retention-days: 30

  installed-artifact:
    needs: cpu-and-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
        distribution: [wheel, sdist]
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@v7
        with:
          name: SEAREG-package
          path: ${{ runner.temp }}/seareg-distributions
      - name: Install selected distribution
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/installed-env"
          target_python="$RUNNER_TEMP/installed-env/bin/python"
          "$target_python" -I -c 'from pathlib import Path; import sysconfig; header = Path(sysconfig.get_path("include")) / "Python.h"; print("Python build header:", header); assert header.is_file(), header'
          c++ --version
          cmake --version
          "$target_python" -m pip install --upgrade pip
          "$target_python" -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
          if [ '${{ matrix.distribution }}' = wheel ]; then
            artifact=("$RUNNER_TEMP"/seareg-distributions/*.whl)
          else
            artifact=("$RUNNER_TEMP"/seareg-distributions/*.tar.gz)
          fi
          test "${#artifact[@]}" -eq 1
          "$target_python" -m pip install "${artifact[0]}[analysis]"
          "$target_python" -m pip check
          "$target_python" -m pip freeze > "$RUNNER_TEMP/installed-requirements.txt"
      - name: Check installed package and commands
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/outside checkout"
          cd "$RUNNER_TEMP/outside checkout"
          "$RUNNER_TEMP/installed-env/bin/python" -I - "$RUNNER_TEMP/installed-package.json" <<'PY'
          import importlib.metadata
          import importlib.resources
          import json
          import os
          from pathlib import Path
          import sys
          import seareg
          import torch
          from seareg.multislice.config import MultiSliceConfig
          from seareg.multislice.geometry import spatial_coverage_report
          from seareg.multislice.model import MicroGainTailgate

          installed = Path(seareg.__file__).resolve()
          assert installed.is_relative_to(Path(sys.prefix).resolve()), installed
          assert seareg.__version__ == importlib.metadata.version("seareg")
          assert seareg.__version__ == '1.0.0'
          assert MultiSliceConfig().correction_mode == 'cs_matched03'
          coordinates = torch.tensor([[x, y] for x in range(3) for y in range(3)], dtype=torch.float32)
          distance = torch.cdist(coordinates, coordinates)
          row, col = torch.where((distance > 0) & (distance < 1.5))
          spatial = torch.sparse_coo_tensor(torch.stack((row, col)), torch.ones(len(row)), (9, 9)).coalesce()
          codes = torch.zeros(9, dtype=torch.long)
          coverage = spatial_coverage_report(coordinates, spatial, codes)
          assert coverage['total_spots'] == 9
          assert coverage['per_slice'][0]['cardinal_covered'] == 1
          spots = torch.arange(9).repeat_interleave(2)
          peaks = (spots + torch.arange(len(spots)) % 2) % 5 + 9
          edges = torch.cat((torch.stack((spots, peaks)), torch.stack((peaks, spots))), dim=1)
          graph = torch.sparse_coo_tensor(edges, torch.full((edges.shape[1],), 0.25), (14, 14)).coalesce()
          model = MicroGainTailgate(9, 5, 8, torch.full((9,), 2.0), coordinates, codes)
          model.initialize_adaptive_gate(spatial, 16, 1234, codes)
          model.refresh_selective_geometry(graph, spatial)
          values = model.propagate(graph, None, spatial, True, 0.3, 0.0)
          assert values[0].shape == (9, 8) and values[1].shape == (5, 8)
          assert all(torch.isfinite(value).all() for value in values if value is not None)
          (values[0].square().sum() + values[1].square().sum()).backward()
          assert all(parameter.grad is not None and torch.isfinite(parameter.grad).all() for parameter in model.parameters())
          package = importlib.resources.files("seareg")
          for name in ("scanners/scan_for_kmers_motifs_new_2024.R",
                       "scanners/legacy_motif_recipe.json",
                       "_compiler/cuda11/ptxas", "_compiler/cuda11/LICENSE",
                       "THIRD_PARTY_NOTICES.md"):
              assert package.joinpath(name).is_file(), name
          assert os.access(package.joinpath("_compiler/cuda11/ptxas"), os.X_OK)
          report = {"state": "complete", "version": seareg.__version__, "installed": str(installed)}
          Path(sys.argv[1]).write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          PY
          "$RUNNER_TEMP/installed-env/bin/seareg" --help
          "$RUNNER_TEMP/installed-env/bin/seareg-annotate" --help
      - name: Save installation record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-${{ matrix.distribution }}-python${{ matrix.python }}
          path: |
            ${{ runner.temp }}/installed-package.json
            ${{ runner.temp }}/installed-requirements.txt
          if-no-files-found: warn
          retention-days: 30
